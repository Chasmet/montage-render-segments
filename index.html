<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Studio Vidéo IA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="box">
      <h1>Studio Vidéo IA</h1>
      <p>Envoie une vidéo au moteur Render.</p>
      <span class="badge">Max 3 min</span>
      <span class="badge">Max 150 Mo</span>
      <span class="badge">Segments 10 s</span>
      <span class="badge">Export MP4</span>
    </section>

    <section class="box">
      <p class="warn">URL Render</p>
      <input id="backend" placeholder="https://ton-service.onrender.com">
      <button onclick="saveBackend()">Sauvegarder l'URL Render</button>
      <button onclick="testBackend()">Tester le serveur</button>
    </section>

    <section class="box">
      <input id="video" type="file" accept="video/mp4,video/*" onchange="fileInfo()">
      <p id="info">Aucune vidéo choisie.</p>
      <button onclick="sendVideo()">Envoyer la vidéo et créer le MP4</button>
    </section>

    <section class="box">
      <div id="log" class="log">Interface prête.</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
